[project]
name = "trainer-app"
version = "0.1.0"
description = "Track B TRL GRPO/ART training app wrapper."
requires-python = ">=3.10"
dependencies = [
  "agent-contracts",
  "agent-rewards",
  "lightning-bridge",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=0.28",
  "datasets>=2.18",
  "peft>=0.15",
  "torch>=2.0",
  "transformers>=4.51",
  "trl>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
