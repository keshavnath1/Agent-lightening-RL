[project]
name = "ruler-scorer"
version = "0.1.0"
description = "RULER and vLLM judge scoring app wrapper."
requires-python = ">=3.10"
dependencies = [
  "agent-contracts",
  "agent-rewards",
  "requests>=2.31",
]

[project.optional-dependencies]
vllm = [
  "vllm>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
