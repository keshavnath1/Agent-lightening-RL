[project]
name = "mcp-client-bridge"
version = "0.1.0"
description = "Compatibility package for official MCP client and LangChain bridge helpers."
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0.0",
  "langchain-mcp-adapters>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
